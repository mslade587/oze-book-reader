name: Publish reader

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages and record the result
        run: |
          code=$(curl -s -o /tmp/pages.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mslade587/oze-book-reader/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "HTTP $code" | tee pages-status.txt
          tail -c 300 /tmp/pages.out | tee -a pages-status.txt
          git config user.name "oze-backup-bot"
          git config user.email "418573342+oze-backup-bot@users.noreply.github.com"
          git add pages-status.txt
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "record pages enable result"
          git push
