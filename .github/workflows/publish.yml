name: Publish reader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the reader
        run: curl -sL -o index.html https://litter.catbox.moe/mjytlo.html
      - name: Commit and push
        run: |
          git config user.name "oze-backup-bot"
          git config user.email "418573342+oze-backup-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Add OZE Book Reader v2.7"
          git push
