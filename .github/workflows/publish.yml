name: Publish reader

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages for this repo
        run: |
          code=$(curl -s -o /tmp/pages.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mslade587/oze-book-reader/pages \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "Pages enable HTTP $code"
          cat /tmp/pages.out
